us \u2640 || Jupiter \u2643", "impact": "Strong Hidden Reversal", "type": "geo"}]}, {"date_key": "2027-09-26", "display_date": "26 September 2027", "events": [{"time": "00:16 WIB", "event": "Parallel Declination: Matahari \u2609 || Uranus \u2645", "impact": "Strong Hidden Reversal", "type": "geo"}, {"time": "00:16 WIB", "event": "Parallel Declination: Merkurius \u263f || Saturnus \u2644", "impact": "Strong Hidden Reversal", "type": "geo"}, {"time": "00:16 WIB", "event": "Parallel Declination: Venus \u2640 || Jupiter \u2643", "impact": "Strong Hidden Reversal", "type": "geo"}]}];
    let currentIndex = 0;

    function renderTable(index) {
        if (index < 0) index = 0;
        if (index >= db.length) index = db.length - 1;
        currentIndex = index;

        const dayData = db[currentIndex];
        document.getElementById('currentDisplayDate').innerText = dayData.display_date;
        document.getElementById('datePicker').value = dayData.date_key;

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (dayData.events.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="no-event">Tidak ada cluster reversal mayor pada tanggal ini</td></tr>';
            return;
        }

        dayData.events.forEach(item => {
            let colorClass = 'badge-geo';
            if (item.type === 'moon') colorClass = 'badge-moon';
            if (item.type === 'helio' || item.type === 'stationary') colorClass = 'badge-helio';

            const row = `<tr>
                <td><b>${item.time}</b></td>
                <td class="${colorClass}">${item.event}</td>
                <td>${item.impact}</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function changeDay(step) {
        renderTable(currentIndex + step);
    }

    function onDateSelect(selectedDateStr) {
        const foundIndex = db.findIndex(item => item.date_key === selectedDateStr);
        if (foundIndex !== -1) {
            renderTable(foundIndex);
        } else {
            alert('Tanggal di luar jangkauan data 1 tahun!');
        }
    }

    // Auto-load Hari Ini saat dibuka
    renderTable(0);
